# Athena server, self-hosted.
#
#   docker compose up -d
#
# Pulls the published image, so this file is the only thing you need on the
# host. No checkout, no Node, no Go toolchain. To build from a checkout instead
# of pulling, see docker-compose.build.yml.
#
# Updating:
#
#   docker compose pull && docker compose up -d
#
# The watchtower service below does that on its own every hour. Delete it if you
# would rather update by hand.
#
# Data (the SQLite database, uploads, backups, and the runtime config file)
# lives in ./data, bind-mounted below. Keep that directory and you keep the
# library.

services:
  athena:
    image: ghcr.io/athenaeum-app/athena:latest
    container_name: athena-server
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Days a login stays valid. 0 means sessions never expire.
      - SESSION_EXPIRY_DAYS=30

      # Soft-deleted moments and chat messages older than this many days are
      # permanently removed by a background job.
      - PRUNE_AFTER_DAYS=365

      # Automated backups. BACKUP_INTERVAL is a Go duration ("24h", "90m");
      # setting it to 0 disables them. These override whatever the Settings
      # UI wrote to data/athena.config.json.
      - BACKUP_INTERVAL=24h
      - BACKUP_RETENTION=7

      # How long a scraped link preview is cached, in hours.
      - PREVIEW_CACHE_TTL_HOURS=168

      # Largest single upload accepted, in megabytes.
      - MAX_UPLOAD_MB=50
    volumes:
      - ./data:/app/data
    labels:
      # Watchtower only touches containers carrying this, so everything else on
      # the host is left alone. A mapping rather than a list so an overlay file
      # can flip the value; list-form labels append instead of overriding.
      com.centurylinklabs.watchtower.enable: "true"
    healthcheck:
      # wget is part of alpine's busybox, so nothing extra is installed for it.
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/api/v1/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  # Pulls a newer athena image and restarts the container into it, so updating
  # does not mean logging into the host.
  #
  # This is a maintained fork: containrrr/watchtower, the original, has had no
  # release since 2023. Same flags and the same label namespace.
  #
  # It does not roll back. If a new image fails its healthcheck the container is
  # left failing rather than reverted, so the backup schedule above is what makes
  # an unattended update recoverable.
  watchtower:
    image: ghcr.io/nicholas-fedor/watchtower:latest
    container_name: athena-watchtower
    restart: unless-stopped
    volumes:
      # Not `:ro`. Replacing a container is a write, so read-only leaves it able
      # to see a pending update and unable to apply it.
      - /var/run/docker.sock:/var/run/docker.sock
    command: --label-enable --cleanup --interval 3600
