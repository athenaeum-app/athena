# Athena server
#
#   docker compose up -d
#
# Updating:
#
#   docker compose pull && docker compose up -d
#
# The watchtower service below does that on its own every hour. Delete it if you
# would rather update by hand.
#
# Data (the SQLite database, uploads, backups, and the runtime config file)
# lives in ./data, bind-mounted below. Keep that directory and you keep the
# library.

services:
  athena:
    image: ghcr.io/athenaeum-app/athena:latest
    container_name: athena-server
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # 0 means sessions never expire.
      - SESSION_EXPIRY_DAYS=30

      # Soft-deleted moments and chat messages older than this many days are
      # permanently removed by a background job.
      - PRUNE_AFTER_DAYS=365

      # BACKUP_INTERVAL is a Go duration ("24h", "90m"); 0 disables backups.
      # These override whatever the Settings UI wrote to data/athena.config.json.
      - BACKUP_INTERVAL=24h
      - BACKUP_RETENTION=7

      - PREVIEW_CACHE_TTL_HOURS=168
      - MAX_UPLOAD_MB=50
    volumes:
      - ./data:/app/data
    labels:
      # Watchtower label
      com.centurylinklabs.watchtower.enable: "true"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/api/v1/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  # Auto Updater
  watchtower:
    image: ghcr.io/nicholas-fedor/watchtower:latest
    container_name: athena-watchtower
    restart: unless-stopped
    volumes:
      # Not `:ro`. Replacing a container is a write, so read-only leaves it able to see a pending update and unable to apply it.
      - /var/run/docker.sock:/var/run/docker.sock
    command: --label-enable --cleanup --interval 60
