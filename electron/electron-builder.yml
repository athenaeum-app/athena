# Electron Builder config for the Athena launcher.
# Builds a desktop app that loads the PWA at a user-configured server URL.
# See docs/adr/0002-server-bundled-pwa-client.md for the launcher design.

appId: com.athenaeum.launcher
productName: Athena
directories:
    output: dist
    buildResources: build
files:
    - src/**
    # main.js loads the window and tray icon from these at runtime. They live
    # under buildResources, which electron-builder leaves out of the app package
    # unless it is named, so without these two lines the path resolves to
    # nothing once packaged and the tray never appears.
    - build/icon.ico
    - build/icons/512x512.png
win:
    target: nsis
mac:
    # dmg is what a person downloads; zip is what electron-updater applies an
    # update from. Shipping only the dmg leaves macOS with no update path at
    # all. Note that Squirrel.Mac still refuses to update an unsigned bundle,
    # so mac auto-update stays inert until code signing is configured.
    target:
        - dmg
        - zip
    category: public.app-category.productivity
linux:
    # A directory of NxN.png, not the 1024px build/icon.png. Handed the single
    # source image, electron-builder installs one icon, at its native size, into
    # hicolor/1024x1024, and the hicolor theme declares no such directory: it
    # stops at 512x512. An icon theme lookup only walks the sizes the theme
    # declares, so the desktop entry's Icon= resolved to nothing and desktops
    # fell back to a generic icon. Each file here becomes one hicolor entry.
    icon: build/icons
    # Only the AppImage is self-updating. electron-updater has no feed for a
    # deb or an rpm: those are the system package manager's to update, and here
    # that means the user downloading the next one by hand. rpm builds through
    # fpm, which shells out to rpmbuild, so the Linux release runner has to
    # install it; when that install fails the release job overrides this list
    # from the command line and ships the other two (see
    # .github/workflows/release.yml).
    target:
        - AppImage
        - deb
        - rpm
    category: Office
    # electron-builder 26 moved the [Desktop Entry] keys under `entry`. A flat
    # map here is a schema error that fails the build before it packages.
    desktop:
        entry:
            # electron-builder defaults this to productName ("Athena"), but
            # Chromium takes WM_CLASS from the executable, which is named after
            # the electron package.json "name". `xprop WM_CLASS` on a running
            # window agrees: "athena-client", "athena-client". GNOME still
            # matched the window to its launcher by falling back on the desktop
            # file's own name, so this was a trap rather than a visible break.
            # Keep it equal to the executable name if that is ever renamed.
            StartupWMClass: athena-client
# electron-updater reads the latest.yml files published beside the installers
# here, so this block is also the update feed. It must point at a public repo
# and at a release that is published rather than left as a draft.
#
# releaseType is pinned to draft so every platform in the release matrix
# uploads to the same pre-created draft without racing to publish it (the
# default publishes as soon as one platform finishes its own uploads, which
# leaves the other platforms unable to attach to it afterward). The release
# workflow's publish-release job takes it out of draft once all platforms
# and the server image have succeeded.
publish:
    provider: github
    owner: athenaeum-app
    repo: athena
    releaseType: draft
