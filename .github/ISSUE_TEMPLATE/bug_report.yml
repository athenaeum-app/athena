name: Bug report
description: Something is broken or behaves unexpectedly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do not use this form for security
        vulnerabilities. See [SECURITY.md](../blob/master/SECURITY.md) instead.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the feed
        2. Click ...
        3. See error
    validations:
      required: true

  - type: dropdown
    id: client
    attributes:
      label: Which client?
      options:
        - Desktop app (Electron)
        - Browser / PWA on desktop
        - Browser / PWA on mobile
        - Not client-specific (server side)
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: "v2.0.0, or the commit SHA you built from"
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: OS and browser
      placeholder: "Windows 11, Firefox 141 / Ubuntu 24.04, desktop app"

  - type: textarea
    id: logs
    attributes:
      label: Server log or browser console output
      description: Paste anything relevant. It will be rendered as code.
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for a duplicate
          required: true
        - label: I can reproduce this on the latest version
