name: Feature request
description: Suggest an idea or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to suggest a feature for Athena!

  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: An example would be helpful in weighing the pros for this feature!
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have considered
      description: Including any workaround you are using today.

  - type: dropdown
    id: area
    attributes:
      label: Which part of Athena?
      options:
        - Moments and archives
        - Projects
        - Tasks and agenda
        - Canvas
        - Chat
        - Appearance and layout
        - Server, permissions, or admin
        - Desktop app
        - Other
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for a duplicate
          required: true
