name: Feature request
description: Suggest an idea or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Athena is a personal journaling and archiving tool, and it says no to a
        lot of things to stay that way. Describing the problem you hit tends to
        get further than describing a specific solution.

  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: What are you trying to do that Athena makes hard or impossible?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have considered
      description: Including any workaround you are using today.

  - type: dropdown
    id: area
    attributes:
      label: Which part of Athena?
      options:
        - Moments and archives
        - Tasks and agenda
        - Canvas
        - Chat
        - Appearance and layout
        - Server, permissions, or admin
        - Desktop app
        - Other
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for a duplicate
          required: true
