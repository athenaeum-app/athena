name: Release

# Triggered by pushing a version tag, e.g. `git tag v2.0.1 && git push origin v2.0.1`.
on:
  push:
    tags: ['v*']

jobs:
  docker:
    name: Build & push server image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/athenaeum-app/athena
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      # server/Dockerfile is multi-stage: it builds the client and embeds it
      # into the Go binary, so this single image is the deployable artifact
      # for both client and server. Context is the repo root.
      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: true
          # Stamps the tag into the binary so the running server can report it
          # (Settings -> About). Without this every release says "dev".
          build-args: |
            ATHENA_VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  create-release:
    name: Create draft release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Pre-create the release so the matrix jobs below don't race to create
      # it themselves, since electron-builder would otherwise have each platform
      # create its own separate draft release for the same tag.
      #
      # --target pins the release to the exact commit the tag points to.
      # Without it, gh has to resolve the tag itself, and right after a tag
      # push GitHub's Releases API can lag behind the git ref, causing it to
      # silently fall back to a phantom "untagged-<hash>" release instead of
      # the real one, which then never gets the electron-builder assets.
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if output=$(gh release create "${{ github.ref_name }}" \
            --repo athenaeum-app/athena \
            --target "${{ github.sha }}" \
            --draft --title "${{ github.ref_name }}" --generate-notes 2>&1); then
            echo "$output"
          elif echo "$output" | grep -qi "already exists"; then
            echo "Release already exists, continuing"
          else
            echo "$output" >&2
            exit 1
          fi

  electron:
    name: Desktop app (${{ matrix.os }})
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    defaults:
      run:
        working-directory: electron
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # No lockfile in electron/, so use npm install rather than npm ci.
      - name: Install dependencies
        run: npm install

      # electron-builder reads its own version from this package.json, not
      # from the git tag, so it has to be synced to the tag here or it will
      # keep targeting whatever version it was last bumped to and silently
      # skip publishing once that release is no longer a draft.
      - name: Sync package version to tag
        run: npm version --no-git-tag-version "${GITHUB_REF_NAME#v}"

      # electron-builder.yml declares the GitHub publish provider. Each
      # matrix OS uploads its installers to the release for this tag.
      # Builds are currently unsigned (no code-signing secrets configured).
      - name: Build & publish
        run: npm run build -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
