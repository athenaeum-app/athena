name: Release

# Triggered by pushing a version tag, e.g. `git tag v2.0.1 && git push origin v2.0.1`.
on:
  push:
    tags: ['v*']

# One run per tag. v2.18.5 was delivered twice for a single tag push and the
# two runs raced: each made its own draft (see the create step below), so the
# release that went live held only the mac and windows builds while the Linux
# ones sat in an orphan draft nobody could see.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    name: Build & push server image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      # The in-app version (the "Athena v2.0.0" title) is baked in at build
      # time from client/package.json, via __APP_VERSION__ in
      # client/vite.config.ts -- not from the tag or from ATHENA_VERSION
      # below, which only reaches the Go binary. Nothing was syncing it, so
      # every release since 2.0.0 shipped a client still calling itself
      # 2.0.0. Same fix as the electron job's, and it has to happen before
      # the build below, which builds the client from this checkout.
      #
      # --allow-same-version because the release convention here is a "2.3.0"
      # bump commit followed by the matching tag, which leaves this file
      # already correct. Without the flag npm treats that as "Version not
      # changed" and exits 1, failing the release for doing the right thing.
      - name: Sync client version to tag
        shell: bash
        working-directory: client
        run: npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/athenaeum-app/athena
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      # server/Dockerfile is multi-stage: it builds the client and embeds it
      # into the Go binary, so this single image is the deployable artifact
      # for both client and server. Context is the repo root.
      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: true
          # Stamps the tag into the binary so the running server can report it
          # (Settings -> About). Without this every release says "dev".
          build-args: |
            ATHENA_VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  create-release:
    name: Create draft release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Pre-create the release so the matrix jobs below don't race to create
      # it themselves, since electron-builder would otherwise have each platform
      # create its own separate draft release for the same tag.
      #
      # RELEASES_TOKEN, not GITHUB_TOKEN: this workflow runs in athena-dev
      # (the private source repo), but releases are published to athena (a
      # separate, empty public repo, kept public so electron-updater and a
      # plain `docker pull` work with no auth). The default GITHUB_TOKEN is
      # scoped to whichever repo the workflow runs in, so it cannot write to
      # a different repo; RELEASES_TOKEN is a fine-grained PAT scoped to just
      # athena, with Contents: read/write.
      #
      # --target athena's own master, not github.sha: this tag has no
      # corresponding commit in athena at all, since athena and athena-dev
      # are unrelated histories (athena is just a README). Passing this
      # workflow's own commit SHA as --target made sense back when the
      # release lived in the same repo as the tag, pinning it against the
      # Releases API lagging behind a just-pushed ref, but here it means
      # asking athena to create a tag at a commit it has never heard of,
      # which the API 500s on. athena has nothing resembling per-release
      # commits anyway, so every tag just points at its one and only branch.
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          # Ask before creating, rather than reading the error text.
          # `gh release create --draft` does not refuse a tag that already
          # has a draft: GitHub allows any number of drafts under one tag
          # name, so the old "already exists" branch only ever caught a
          # *published* release and a second run made a second draft.
          if [ "$(gh api "repos/athenaeum-app/athena/releases?per_page=100" \
            --jq '[.[] | select(.tag_name == "${{ github.ref_name }}")] | length')" -gt 0 ]; then
            echo "Release already exists, continuing"
            exit 0
          fi
          gh release create "${{ github.ref_name }}" \
            --repo athenaeum-app/athena \
            --target master \
            --draft --title "${{ github.ref_name }}" --generate-notes

  electron:
    name: Desktop app (${{ matrix.os }})
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    defaults:
      run:
        working-directory: electron
    steps:
      - uses: actions/checkout@v7

      # No cache input here on purpose. setup-node v5+ can enable npm caching
      # automatically, but from v6 that only happens when package.json declares
      # `packageManager`/`devEngines.packageManager` as npm, which none of this
      # repo's manifests do, so the electron install stays uncached as before.
      # electron 43 declares engines.node ">= 22.12.0", so npm install fails the
      # engine check on 20.
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # electron-builder builds the rpm through fpm, which shells out to
      # rpmbuild. The ubuntu runner does not ship it, and without it the rpm
      # is the only target that fails, after the other two have already
      # uploaded.
      - name: Install rpm tooling
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y rpm

      # No lockfile in electron/, so use npm install rather than npm ci.
      - name: Install dependencies
        run: npm install

      # electron-builder reads its own version from this package.json, not
      # from the git tag, so it has to be synced to the tag here or it will
      # keep targeting whatever version it was last bumped to and silently
      # skip publishing once that release is no longer a draft.
      - name: Sync package version to tag
        shell: bash
        run: npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}"

      # electron-builder.yml declares the GitHub publish provider. Each
      # matrix OS uploads its installers to the release for this tag.
      # Builds are currently unsigned (no code-signing secrets configured).
      #
      # This intentionally leaves the release as a draft (electron-builder's
      # default). If it published straight to live, the first platform to
      # finish would flip the release out of draft while the other two are
      # still mid-upload, and their uploads would then hit the same
      # existingType/publishingType mismatch that skipped v2.0.1's assets.
      # publish-release below flips it live only once every platform, plus
      # the server image, is confirmed done.
      - name: Build & publish
        run: npm run build -- --publish always
        env:
          # See create-release's comment: publishing to athena, not this
          # workflow's own athena-dev, needs the cross-repo PAT.
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}

  publish-release:
    name: Publish release
    needs: [docker, create-release, electron]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Everything (server image + all three desktop builds) succeeded, so
      # take the release out of draft and mark it the latest release.
      - name: Publish and mark latest
        env:
          # See create-release's comment: publishing to athena, not this
          # workflow's own athena-dev, needs the cross-repo PAT.
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          gh release edit "${{ github.ref_name }}" \
            --repo athenaeum-app/athena \
            --draft=false --latest
