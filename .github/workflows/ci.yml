name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Cancel superseded runs on the same ref (e.g. new push to a PR).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  style:
    name: Style (punctuation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # House style: plain ASCII punctuation in source and docs. Em and en
      # dashes render inconsistently across terminals, editors and fonts, and
      # a comma, colon or full stop always says the same thing.
      # The pattern is written as hex escapes on purpose, so this file does not
      # trip its own check.
      - name: No em or en dashes
        run: |
          if hits=$(git grep -InP '[\x{2014}\x{2013}]' -- . ':!*.png' ':!*.ico'); then
            echo "Em or en dashes found. Use a comma, colon, or full stop instead:"
            echo "$hits"
            exit 1
          fi

  client:
    name: Client (typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      # Note: vite outputs into ../server/client/web (see vite.config.ts).
      # Here we only verify the build succeeds; the release image rebuilds it.
      - name: Build
        run: npm run build

  server:
    name: Server (gofmt, vet, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: server/go.sum

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...
